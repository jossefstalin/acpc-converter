<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Air Conflicts Model Workshop</title><style>
:root{font:14px system-ui;color:#dce6f4;background:#101721}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:310px 1fr;height:100vh}aside{padding:22px;background:#172131;overflow:auto;border-right:1px solid #31415a}h1{font-size:21px;line-height:1.25;margin:0 0 8px}.sub{font-size:12px;color:#9bacbf;line-height:1.6}label{display:block;margin:18px 0 6px;color:#c6d4e5}button,select,input[type=text]{width:100%;padding:10px;background:#25354b;color:#fff;border:1px solid #415777;border-radius:6px;margin:4px 0}button{cursor:pointer}button:hover{background:#35547a}input[type=file]{width:100%;font-size:11px}input[type=range]{width:100%}main{position:relative;min-width:0}canvas{width:100%;height:100%;display:block}#info{position:absolute;left:24px;top:20px;white-space:pre-line;font:13px/1.65 system-ui;pointer-events:none}#status{padding:12px;color:#9ad4e8;white-space:pre-wrap;overflow-wrap:anywhere}footer{position:absolute;bottom:18px;left:24px;color:#8296b3;font-size:12px}.pill{display:inline-block;color:#83d9c4;font-size:11px;letter-spacing:1px;margin-bottom:12px}a{color:#95c8ff}@media(max-width:750px){body{grid-template-columns:250px 1fr}aside{padding:12px}}
</style></head><body><aside><span class="pill">OFFLINE · OPEN SOURCE · v0.1</span><h1>Air Conflicts<br>Model Workshop</h1><p class="sub">太平洋版兼容模型查看器与静态转换工具。独立实现，非 3Division 官方 Modelviewer 修改版。文件仅在本机内存中处理。</p>
<label>打开模型、MTL 和贴图（可多选）</label><input id="files" type="file" multiple>
<label>或打开一个完整资源文件夹</label><input id="folder" type="file" webkitdirectory multiple>
<button id="demo">打开内置校验模型（无游戏素材）</button><label>模型</label><select id="models"><option>请先选择文件</option></select>
<label>OBJ 坐标约定</label><select id="axes"><option value="zup">Z 向上，Y 向前（Blender / Max）</option><option value="yup">Y 向上，Z 向前</option></select>
<label>显示</label><select id="display"><option value="0">颜色贴图</option><option value="1">法线</option><option value="2">UV 棋盘</option><option value="3">线框</option></select>
<label id="frameLabel">BMF 帧：0</label><input id="frame" type="range" min="0" max="0" value="0"><button id="play">播放 / 暂停 BMF 帧</button>
<label>导出游戏目录名</label><input id="target" type="text" value="my_plane">
<button id="msh">导出 MSH + MTL + DDS 覆盖包</button><button id="bmf">导出当前帧 BMF</button>
<div id="status">拖动旋转，滚轮缩放。\nMSH 保留颜色 UV 与光照 UV；OBJ 仅有一套 UV 时使用白色光照贴图。</div></aside><main><canvas id="view"></canvas><div id="info">选择 .bmf、.msh 或 .obj 模型</div><footer>左键旋转 · 滚轮缩放 · 双击复位 · DDS DXT1 / DXT3 / DXT5 / RGBA32</footer></main><script src="codec.js"></script><script src="viewer.js"></script></body></html>
