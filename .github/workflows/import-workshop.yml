name: Import checked Workshop source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'jossefstalin/acpc-converter' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import the verified source archive
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, pathlib, zipfile

          archive = pathlib.Path("WORKSHOP_SOURCE.zip.b64")
          payload = base64.b64decode(archive.read_bytes())
          assert hashlib.sha256(payload).hexdigest() == "aa52031fdc4124509b3cb9456bb6802afb2911c5b0bf6bba74985d41d9da48bf"
          with zipfile.ZipFile(io.BytesIO(payload)) as source:
              for name in source.namelist():
                  parts = pathlib.PurePosixPath(name).parts
                  assert parts and ".." not in parts and parts[0] not in ("/", ".git", ".github")
                  assert "\\" not in name
                  target = pathlib.Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read(name))
          PY
          git rm -- WORKSHOP_SOURCE.zip.b64
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Air Conflicts Workshop v0.2.0-alpha source"
          git push origin HEAD:main
