name: Build release packages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to
        required: true
        default: v0.2.0-alpha
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m unittest discover -s tests
      - run: node tests/test_codec.js
      - run: .\viewer\native\build_windows.cmd
      - run: python tests/smoke_native.py dist/AirConflicts_Viewer_Windows_x64.exe
      - run: python package_release.py --windows-exe dist/AirConflicts_Viewer_Windows_x64.exe
      - name: Attach release packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $packages = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release upload "$env:RELEASE_TAG" @packages --clobber
